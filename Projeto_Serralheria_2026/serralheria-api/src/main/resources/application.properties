spring.application.name=serralheria-api
server.port=8080

# Conexão com o banco MySQL (criado pelo script banco/ddl_serralheria.sql)
spring.datasource.url=jdbc:mysql://localhost:3306/serralheria_garcia?createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true&useSSL=false&serverTimezone=America/Sao_Paulo
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# As tabelas são criadas pelo script DDL; o Hibernate apenas confere se as entidades batem com o banco
spring.jpa.hibernate.ddl-auto=validate
# Usa exatamente os nomes de tabela/coluna informados em @Table/@Column
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
