spring.application.name=serralheria-api-test

# Banco de dados H2 em memória para testes (não depende de MySQL externo ativo no build)
spring.datasource.url=jdbc:h2:mem:serralheria_garcia;DB_CLOSE_DELAY=-1;MODE=MySQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
